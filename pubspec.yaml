name: almadar_news
description: "المدار الإخبارية - تطبيق أخبار احترافي"
publish_to: "none"
version: 1.0.3+4

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # Network
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3

  # Caching & Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  cached_network_image: ^3.3.1

  # Firebase
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.2.2

  # UI Extras
  flutter_widget_from_html_core: ^0.16.1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  smooth_page_indicator: ^1.1.0
  share_plus: ^10.0.0
  url_launcher: ^6.3.0
  font_awesome_flutter: ^10.7.0
  photo_view: ^0.14.0

  # Native video players (no webview)
  youtube_player_flutter: ^9.1.1
  video_player: ^2.9.2
  chewie: ^1.8.5

  # Utils
  intl: ^0.19.0
  dartz: ^0.10.1
  equatable: ^2.0.5
  logger: ^2.4.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.1
  timeago: ^3.6.1
  package_info_plus: ^9.0.0

  # Fonts
  google_fonts: ^6.2.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  hive_generator: ^2.0.1
  json_annotation: ^4.9.0
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
    # خط عربي أساسي (Tajawal) — يعرض العربية بشكل صحيح في كل التطبيق.
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
